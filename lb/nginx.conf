# Load balancer: spreads requests across the three Next.js containers
# (round-robin). It does no caching; that's the CDN's and Redis's job.
upstream nextjs {
  server web1:3000;
  server web2:3000;
  server web3:3000;
}

server {
  listen 80;

  location / {
    proxy_pass http://nextjs;
    proxy_http_version 1.1;
    # $http_host keeps the port ("localhost:8080"). Next.js rejects a server
    # action (the edit form) unless the browser's Origin matches this host.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Shows which container answered, handy when watching the shared cache
    add_header X-Served-By $upstream_addr always;
  }
}
