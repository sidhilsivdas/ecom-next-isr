services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5433:5432" # 5432 is already used on the host
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on the first start with an empty volume
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # Cache only: evict least-recently-used keys when memory is full
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---- Three Next.js containers sharing one Redis cache ----
  web1: &web
    image: ecom-web:${CACHE:-redis}
    # Run `npm run build:docker` (or build:docker:disk with CACHE=disk) in ./web first
    build: ./web
    environment: &web-env
      DATABASE_URL: postgres://shop:shop@postgres:5432/shop
      REDIS_URL: redis://redis:6379
      INSTANCE_NAME: web1
      CACHE_DEBUG: "1"
      CDN_PURGE_URL: http://cdn/
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web2:
    <<: *web
    build: !reset null
    environment:
      <<: *web-env
      INSTANCE_NAME: web2

  web3:
    <<: *web
    build: !reset null
    environment:
      <<: *web-env
      INSTANCE_NAME: web3

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80" # direct to the load balancer, bypassing the CDN
    depends_on: [web1, web2, web3]

  # ---- Local CDN: Varnish in front of the load balancer ----
  cdn:
    image: varnish:7.7
    volumes:
      - ./cdn/default.vcl:/etc/varnish/default.vcl:ro
    # Start Varnish in the background, then print one log line per request
    # (hit / miss / pass / synth=purge) so it shows up in Dozzle.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        varnishd -f /etc/varnish/default.vcl -a :80 -s malloc,256m &&
        exec varnishncsa -F '[cdn] %{Varnish:handling}x %s %m %U%q %{Varnish:time_firstbyte}xs'
    ports:
      - "8088:80" # the main entry point: browse the shop here (8000 is used on this machine)
    depends_on: [lb]

  # ---- GUI tools ----
  redisinsight: # http://localhost:5540 → browse cached pages, tags, live commands
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redisinsight:/data # keeps the saved connection (host: redis, port: 6379)
    depends_on: [redis]

  dozzle: # http://localhost:9999 → live logs of all containers in the browser
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9999:8080"

volumes:
  pgdata:
  redisinsight:
